name: macOS experimental smoke test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  macos-python:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install macOS requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-macos.txt
      - name: Static checks (no audio/GUI permissions in CI)
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests_macos -v
